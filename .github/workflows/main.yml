on: push: branches: [ "main" ]

jobs: build: runs-on: ubuntu-latest

steps: # Baixa o código - name: Baixar código uses: actions/checkout@v3

 # Instala Python
 - name: Instalar Python
   uses: actions/setup-python@v4
   with:
     python-version: '3.10'

 # Executa o programa
 - name: Rodar código
   run: python seu_arquivo.py
